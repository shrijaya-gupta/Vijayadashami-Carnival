<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Vijayadashami Carnival — Authorized Organizer Admin Login Portal">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login | Vijayadashami Carnival</title>

  <!-- Google Fonts: Cinzel, Outfit, JetBrains Mono (Website Theme) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Admin Stylesheet -->
  <link rel="stylesheet" href="css/admin.css?v=2.2">
</head>
<body class="login-body">

  <div class="login-glow-orb" aria-hidden="true"></div>

  <main class="login-card" role="main">
    <div class="login-brand-header">
      <div class="login-brand-badge">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="16" height="16" aria-hidden="true">
          <g transform="rotate(-25 12 12)">
            <path d="M7 3 C9.5 4.5, 12 7.5, 15.5 12 C12 16.5, 9.5 19.5, 7 21" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round" fill="none"/>
            <path d="M15 10.5 C15.6 11.2, 15.8 11.6, 15.8 12 C15.8 12.4, 15.6 12.8, 15 13.5" stroke="#D97706" stroke-width="3" stroke-linecap="round"/>
            <circle cx="7" cy="3" r="0.9" fill="#FDE047"/>
            <circle cx="7" cy="21" r="0.9" fill="#FDE047"/>
            <path d="M7 3 L2.5 12 L7 21" stroke="#FDE047" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="2.5" y1="12" x2="21" y2="12" stroke="#FFFDF9" stroke-width="2" stroke-linecap="round"/>
            <path d="M16 8 L22.5 12 L16 16 L17.8 12 Z" fill="#FDE047" stroke="#D97706" stroke-width="0.8" stroke-linejoin="round"/>
            <path d="M4.5 9.5 L2 12 L4.5 14.5" stroke="#FDE047" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </svg>
        <span>Organizer Portal</span>
      </div>
      <h1 class="login-title">Event Admin Login</h1>
      <p class="login-subtitle">Vijayadashami Carnival Management Dashboard</p>
    </div>

    <!-- Error Banner -->
    <div id="loginErrorAlert" class="login-error-alert" style="display: none;" role="alert" aria-live="assertive">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span id="loginErrorMsg">Invalid username or password.</span>
    </div>

    <!-- Login Form -->
    <form id="adminLoginForm" class="login-form" novalidate>
      <div class="form-group">
        <label for="adminUsername" class="form-label">Email or Username</label>
        <div class="form-input-wrap">
          <span class="form-input-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <input type="text" id="adminUsername" class="form-input" placeholder="Enter admin email or username" required autocomplete="username" spellcheck="false">
        </div>
      </div>

      <div class="form-group">
        <label for="adminPassword" class="form-label">Password</label>
        <div class="form-input-wrap">
          <span class="form-input-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <input type="password" id="adminPassword" class="form-input" placeholder="••••••••••••" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" id="btnLoginSubmit" class="btn-login-submit">
        <span id="btnLoginText">Sign In to Dashboard</span>
        <svg id="btnLoginIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </form>

    <div class="login-back-link">
      <a href="../index.html">&larr; Back to Public Event Website</a>
    </div>
  </main>

  <!-- Login Logic Script -->
  <script src="js/login.js?v=2.2"></script>
</body>
</html>
