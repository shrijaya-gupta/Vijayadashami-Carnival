<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C0519" />
      <stop offset="100%" stop-color="#1A0208" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Festive Ring -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="#D4AF37" stroke-width="2.5" />
  <circle cx="50" cy="50" r="44" fill="none" stroke="#F59E0B" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6" />
  
  <!-- Celestial Bow (Kodanda) -->
  <path d="M36 24 C22 38, 22 62, 36 76 C37 77, 39 76, 38.5 74.5 C25 61, 25 39, 38.5 25.5 C39 24, 37 23, 36 24 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  
  <!-- Bow String -->
  <line x1="36" y1="24" x2="36" y2="76" stroke="#FEF3C7" stroke-width="1" opacity="0.8" />
  
  <!-- Celestial Glowing Arrow Drawn -->
  <line x1="28" y1="50" x2="72" y2="50" stroke="#FFFDF0" stroke-width="2.5" filter="url(#glow)" />
  <!-- Arrow Head -->
  <polygon points="72,50 63,44 65,50 63,56" fill="url(#goldGrad)" />
  <!-- Arrow Fletching -->
  <line x1="30" y1="46" x2="26" y2="50" stroke="#F59E0B" stroke-width="1.8" />
  <line x1="30" y1="54" x2="26" y2="50" stroke="#F59E0B" stroke-width="1.8" />
  <line x1="33" y1="46" x2="29" y2="50" stroke="#F59E0B" stroke-width="1.8" />
  <line x1="33" y1="54" x2="29" y2="50" stroke="#F59E0B" stroke-width="1.8" />
  
  <!-- Central Sparkle -->
  <circle cx="72" cy="50" r="2.5" fill="#FFF" />
</svg>
